[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "componedor"
version = "0.1.0"
description = "Componedor de planos PDF A1 a partir de detalles vectoriales del Exportador Vectorial (ERCO)."
readme = "README.md"
requires-python = ">=3.12"
# PyMuPDF: misma versión mayor que el Exportador Vectorial (PyMuPDF>=1.24.0,<2.0.0).
# rasterio (trae GDAL y numpy): leer las ortofotos GeoTIFF por ventanas y reproyectarlas.
dependencies = ["pymupdf>=1.24,<2", "rasterio>=1.4,<2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Recursos del editor HTML de planos (se incrustan en editor.html).
componedor = ["editor/*.html", "editor/*.css", "editor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
